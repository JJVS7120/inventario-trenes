<!DOCTYPE html>
<html>
<head>
    <title>Nueva Caja</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

    <!-- CABECERA -->
    <div class="mb-4">
        <h1 class="fw-bold">📦 Nueva Caja</h1>
        <p class="text-muted">
            Crear una nueva caja para almacenar artículos
        </p>
    </div>

    <!-- FORMULARIO -->
    <div class="card shadow-sm">

        <div class="card-header">
            <h5 class="mb-0">📝 Datos de la caja</h5>
        </div>

        <div class="card-body">

            <form method="post">

                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input
                        type="text"
                        name="nombre"
                        class="form-control"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Tipo</label>
                    <input
                        <select name="tipo" class="form-select">
						<option value="">Seleccionar...</option>
						<option>Locomotoras</option>
						<option>Vagones</option>
						<option>Accesorios</option>
						<option>Digital</option>
						<option>Vía</option>
</select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Capacidad</label>
                    <input
                        type="number"
                        name="capacidad"
                        class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Ubicación</label>
                    <input
                        type="text"
                        name="ubicacion"
                        class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Sububicación</label>
                    <input
                        type="text"
                        name="sububicacion"
                        class="form-control">
                </div>

                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-success">
                        ➕ Crear caja
                    </button>

                    <a
                        href="/cajas"
                        class="btn btn-secondary">
                        ← Volver
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
