<!DOCTYPE html>
<html>
<head>
    <title>Editar Caja</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

    <!-- CABECERA -->
    <div class="mb-4">
        <h1 class="fw-bold">✏️ Editar Caja</h1>
        <p class="text-muted">
            Modifica los datos de la caja {{ caja.Nombre }}
        </p>
    </div>

    <!-- FORMULARIO -->
    <div class="card shadow-sm">

        <div class="card-header">
            <h5 class="mb-0">📦 Datos de la caja</h5>
        </div>

        <div class="card-body">

            <form method="post">

                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input
                        type="text"
                        name="nombre"
                        class="form-control"
                        value="{{ caja.Nombre }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Tipo</label>
                    <input
                        type="text"
                        name="tipo"
                        class="form-control"
                        value="{{ caja.Tipo }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Capacidad</label>
                    <input
                        type="number"
                        name="capacidad"
                        class="form-control"
                        value="{{ caja.Capacidad }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Ubicación</label>
                    <input
                        type="text"
                        name="ubicacion"
                        class="form-control"
                        value="{{ caja['Ubicación'] }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Sububicación</label>
                    <input
                        type="text"
                        name="sububicacion"
                        class="form-control"
                        value="{{ caja['Sububicación'] }}">
                </div>

                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-success">
                        💾 Guardar cambios
                    </button>

                    <a
                        href="/caja/{{ caja.CajaID }}"
                        class="btn btn-secondary">
                        ← Volver
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
