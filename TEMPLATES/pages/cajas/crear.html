{% extends "base.html" %}

{% block title %}Nueva caja{% endblock %}

{% block content %}

<div class="mb-4">
    <h1>📦 Nueva caja</h1>
    <p class="text-muted">
        Crear una nueva caja de almacenamiento
    </p>
</div>

<form method="post">

    <div class="card shadow-sm">

        <div class="card-body">

            <div class="mb-3">

                <label class="form-label">
                    Nombre
                </label>

                <input
                    type="text"
                    name="nombre"
                    class="form-control"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Tipo
                </label>

                <input
                    type="text"
                    name="tipo"
                    class="form-control">

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Capacidad
                </label>

                <input
                    type="number"
                    name="capacidad"
                    class="form-control">

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Ubicación
                </label>

                <input
                    type="text"
                    name="ubicacion"
                    class="form-control">

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Sububicación
                </label>

                <input
                    type="text"
                    name="sububicacion"
                    class="form-control">

            </div>

        </div>

    </div>

    <div class="mt-3">

        <button
            type="submit"
            class="btn btn-success">

            Crear caja

        </button>

        <a
            href="/cajas"
            class="btn btn-secondary">

            Cancelar

        </a>

    </div>

</form>

{% endblock %}
