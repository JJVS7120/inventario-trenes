<!DOCTYPE html>
<html>

<head>

    <title>Subir imagen</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-4">

    <!-- CABECERA -->
    <div class="mb-4">
        <h1 class="fw-bold">🖼️ Subir imagen</h1>
        <p class="text-muted">
            {{ referencia }}
        </p>
    </div>

    <!-- FORMULARIO -->
    <div class="card shadow-sm">

        <div class="card-header">
            <h5 class="mb-0">📷 Seleccionar archivo</h5>
        </div>

        <div class="card-body">

            <form
                method="post"
                enctype="multipart/form-data">

                <div class="mb-3">

                    <label class="form-label">
                        Imagen del artículo
                    </label>
					<div class="form-text">
						Formatos recomendados: JPG, PNG o WEBP.
					</div>
                    <input
						type="file"
						name="imagen"
						class="form-control"
						accept=".jpg,.jpeg,.png,.webp">

                </div>

                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-success">
                        ⬆️ Subir imagen
                    </button>

                    <a
                        href="/articulo/{{ numero }}"
                        class="btn btn-secondary">
                        ← Volver
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>

</html>
